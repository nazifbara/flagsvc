syntax = "proto3";

package starter.v1;

import "buf/validate/validate.proto";


option go_package = "github/nazifbara/sveltekit-go-connect-grpc-starter/gen/go/v1;sv1";

service AuthService {
    rpc SignUp(SignUpRequest) returns (SignUpResponse) {}
}


message SignUpRequest {
    string email = 1 [(buf.validate.field).string.email=true];
    string firstName = 2 [(buf.validate.field).string.min_len = 1];
    string lastName = 3 [(buf.validate.field).string.min_len = 1];
    string password = 4 [(buf.validate.field).string.min_len = 8];
    string timezone = 5 [(buf.validate.field).string.min_len = 1];
}

message SignUpResponse {}

