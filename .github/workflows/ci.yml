name: ci

on:
  pull_request:
    branches: [main]

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - name: Run sqlc generate
        run: sqlc generate

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run go vet
        run: go vet

      - name: Run go tests
        run: go test ./... -cover -race

      - name: Check security
        run: gosec -exclude-generated ./...

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - name: Run sqlc generate
        run: sqlc generate

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Check format
        run: test -z $(go fmt ./...)

      - name: Check linting
        run: staticcheck ./...
