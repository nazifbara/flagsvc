name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine   # same image as docker-compose.yml
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: feature-flag-test
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U testuser -d feature-flag-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_URL: postgres://testuser:testpassword@localhost:5432/feature-flag-test?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: Install Go protobuf plugins
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.1

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Generate proto code
        run: buf generate

      - name: Run sqlc generate
        run: sqlc generate

      # Pinned to a master commit: the latest release (v2.29.0) bundles
      # golang.org/x/tools v0.49.0, which can't read Go 1.27 export data.
      # Switch back to a tagged release once one ships with x/tools >= v0.52.0.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@14ef84f6feccf40be7f5092fd2db119bf3f5f836

      - name: Run go vet
        run: go vet ./...

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.1

      - name: Migrate test database
        run: goose -dir ./backend/sql/schema postgres "$TEST_DB_URL" up

      - name: Run go tests
        run: go test ./... -cover -race

      - name: Check security
        run: gosec -exclude-generated -exclude-dir=node_modules ./...

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: Install Go protobuf plugins
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.1

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Generate proto code
        run: buf generate

      - name: Run sqlc generate
        run: sqlc generate

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Check format
        run: test -z $(go fmt ./...)

      - name: Check linting
        run: staticcheck ./...
